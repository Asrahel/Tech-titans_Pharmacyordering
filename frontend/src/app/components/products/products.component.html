<div class="products container">
    <h2>Products</h2>
    <div *ngIf="message" class="alert alert-info">{{ message }}</div>

    <div class="row">
        <div class="col-md-4 mb-3" *ngFor="let p of products">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ p.name }}</h5>
                    <p class="card-text text-muted small">{{ p.dosage }}</p>
                    <p class="card-text">{{ p.description }}</p>
                    <div class="mt-auto">
                        <p class="mb-2"><strong>{{ p.price | currency }}</strong></p>
                        <button class="btn btn-primary me-2" (click)="addToCart(p.productId)" [disabled]="loading">Add
                            to cart</button>
                        <a class="btn btn-link" [routerLink]="['/product', p.productId]">Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
